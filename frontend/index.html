<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZUO AI Agent</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#667eea;--primary-dark:#5a6fd6;--primary-light:#e8ebff;--bg:#f5f6fa;--card-bg:#fff;--text:#333;--text-secondary:#888;--border:#e8e8e8;--danger:#e74c3c;--success:#27ae60;--warning:#f39c12;--radius:8px;--shadow:0 2px 12px rgba(0,0,0,0.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
button{cursor:pointer;border:none;outline:none;font-size:14px;transition:all 0.2s}
input,select,textarea{outline:none;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:14px;transition:border 0.2s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.btn{padding:8px 20px;border-radius:var(--radius);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#c0392b}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:4px 12px;font-size:12px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.loading{text-align:center;padding:40px;color:var(--text-secondary)}
.error{text-align:center;padding:40px;color:var(--danger)}
.empty{text-align:center;padding:40px;color:var(--text-secondary)}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-align:center}
.stat-card .stat-value{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab{padding:8px 20px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;font-size:14px;font-weight:500}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--primary)}
table{width:100%;border-collapse:collapse}
th{background:var(--primary-light);color:var(--primary);padding:10px 12px;text-align:left;font-weight:600;font-size:13px}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:hover{background:#fafafe}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px}
.pagination button{padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card-bg);color:var(--text);font-size:13px}
.pagination button:hover{border-color:var(--primary);color:var(--primary)}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{opacity:0.5;cursor:not-allowed}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn 0.2s}
.modal{background:var(--card-bg);border-radius:12px;padding:24px;min-width:420px;max-width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.2);animation:slideIn 0.2s}
.modal h3{margin-bottom:16px;color:var(--text)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:4px;font-size:13px;font-weight:500;color:var(--text)}
.form-group input,.form-group select,.form-group textarea{width:100%}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-success{background:#eafaf1;color:var(--success)}
.badge-danger{background:#fde8e8;color:var(--danger)}
.badge-warning{background:#fef9e7;color:var(--warning)}
.badge-info{background:var(--primary-light);color:var(--primary)}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
.context-menu{position:fixed;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);min-width:140px;padding:4px 0;z-index:999;animation:fadeIn 0.15s}
.context-menu-item{padding:8px 16px;cursor:pointer;font-size:13px;color:var(--text);transition:background 0.15s}
.context-menu-item:hover{background:var(--primary-light);color:var(--primary)}
.context-menu-item.danger:hover{background:#fde8e8;color:var(--danger)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
@media(max-width:768px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,createContext,useContext,useMemo} = React;

const API_CONFIG = {AUTH_API:'/api/auth',BUSINESS_API:'/api'};
const api = axios.create({baseURL:''});
api.interceptors.request.use(cfg=>{
  const token=localStorage.getItem('token');
  if(token) cfg.headers.Authorization='Bearer '+token;
  return cfg;
});
api.interceptors.response.use(r=>r,err=>{
  if(err.response&&err.response.status===401){localStorage.removeItem('token');localStorage.removeItem('user');window.location.hash='#/login'}
  return Promise.reject(err);
});

const apiGet=(url,params)=>api.get(url,{params}).then(r=>r.data.data);
const apiPost=(url,data)=>api.post(url,data).then(r=>r.data.data);
const apiPut=(url,data)=>api.put(url,data).then(r=>r.data.data);
const apiDel=(url,data)=>api.delete(url,{data}).then(r=>r.data.data);
const formatTime=ts=>{if(!ts)return'--';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};

const AuthContext=createContext();
function AuthProvider({children}){
  const [user,setUser]=useState(null);
  const [loading,setLoading]=useState(true);
  useEffect(()=>{
    const token=localStorage.getItem('token');
    const savedUser=localStorage.getItem('user');
    if(token&&savedUser){setUser(JSON.parse(savedUser));setLoading(false)}
    else setLoading(false);
  },[]);
  const login=async(username,password)=>{
    const res=await api.post(API_CONFIG.AUTH_API+'/login',{username,password});
    const data=res.data.data||res.data;
    const userData={username:data.username||username,role:data.role||'USER',token:data.token||'mock-token'};
    localStorage.setItem('token',userData.token);
    localStorage.setItem('user',JSON.stringify(userData));
    setUser(userData);
    return userData;
  };
  const logout=()=>{localStorage.removeItem('token');localStorage.removeItem('user');setUser(null);window.location.hash='#/login'};
  return React.createElement(AuthContext.Provider,{value:{user,login,logout,loading}},children);
}

function useAuth(){return useContext(AuthContext)}

function SetupAxios(){const {user}=useAuth();useEffect(()=>{if(user){api.defaults.headers.common['Authorization']='Bearer '+user.token}},[]);return null}

function Header(){
  const {user,logout}=useAuth();
  const [menuOpen,setMenuOpen]=useState(false);
  const menuRef=useRef();
  const timerRef=useRef(null);
  useEffect(()=>{
    const handler=e=>{if(menuRef.current&&!menuRef.current.contains(e.target))setMenuOpen(false)};
    document.addEventListener('mousedown',handler);
    return ()=>document.removeEventListener('mousedown',handler);
  },[]);
  const menuItems=[
    {label:'RAG 对话',path:'#/chat'},
    {label:'全局看板',path:'#/admin/dashboard'},
    {label:'租户管理',path:'#/admin/tenant'},
    {label:'Redis 监控',path:'#/monitor/redis'},
    {label:'DB 监控',path:'#/monitor/db'},
    {label:'日志系统',path:'#/monitor/logs'},
    {label:'审批中心',path:'#/approvals'},
  ];
  const showMenu=()=>{clearTimeout(timerRef.current);setMenuOpen(true)};
  const hideMenu=()=>{timerRef.current=setTimeout(()=>setMenuOpen(false),200)};
  const nav=path=>{setMenuOpen(false);window.location.hash=path};
  return React.createElement('header',{style:{height:56,background:'#fff',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px',position:'sticky',top:0,zIndex:100}},
    React.createElement('div',{ref:menuRef,style:{position:'relative'},onMouseEnter:showMenu,onMouseLeave:hideMenu},
      React.createElement('div',{style:{fontSize:18,fontWeight:700,color:'var(--primary)',cursor:'pointer',padding:'8px 0',userSelect:'none'}},
        'ZUO AI Agent',
        menuOpen&&React.createElement('div',{style:{position:'absolute',top:'100%',left:0,background:'#fff',borderRadius:8,boxShadow:'0 4px 20px rgba(0,0,0,0.15)',minWidth:200,padding:'8px 0',zIndex:200},onMouseEnter:showMenu,onMouseLeave:hideMenu},
          menuItems.map((item,i)=>React.createElement('div',{key:i,style:{padding:'10px 20px',cursor:'pointer',fontSize:14,color:'var(--text)',transition:'background 0.2s'},onMouseEnter:e=>{e.target.style.background='var(--primary-light)';e.target.style.color='var(--primary)'},onMouseLeave:e=>{e.target.style.background='transparent';e.target.style.color='var(--text)'},onClick:()=>nav(item.path)},
            React.createElement('span',null,item.label)
          ))
        )
      )
    ),
    React.createElement('div',{style:{display:'flex',alignItems:'center',gap:16}},
      React.createElement('span',{style:{width:34,height:34,borderRadius:'50%',background:'var(--primary)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:600,fontSize:14}},user?.username?.charAt(0)?.toUpperCase()||'U'),
      React.createElement('span',{style:{fontSize:14,color:'var(--text)'}},user?.username||''),
      React.createElement('button',{className:'btn btn-outline btn-sm',onClick:logout},'退出')
    )
  );
}

function Sidebar({current}){
  const items=[
    {label:'对话聊天',path:'#/chat'},
    {label:'知识库',path:'#/chat/knowledge'},
    {label:'意图路由',path:'#/chat/intent'},
    {label:'个人看板',path:'#/chat/dashboard'},
  ];
  const nav=path=>{window.location.hash=path};
  const isRagPage=current&&(current.startsWith('chat')||current.startsWith('knowledge'));
  if(!isRagPage)return null;
  return React.createElement('div',{style:{width:180,background:'#fff',borderRight:'1px solid var(--border)',padding:'16px 0',minHeight:'calc(100vh - 56px)'}},
    items.map((item,i)=>React.createElement('div',{key:i,style:{padding:'10px 20px',cursor:'pointer',fontSize:14,color:current===item.path.replace('#/','')?'var(--primary)':'var(--text)',background:current===item.path.replace('#/','')?'var(--primary-light)':'transparent',borderRight:current===item.path.replace('#/','')?'3px solid var(--primary)':'3px solid transparent',transition:'all 0.2s',fontWeight:current===item.path.replace('#/','')?600:400},onClick:()=>nav(item.path),onMouseEnter:e=>{if(current!==item.path.replace('#/',''))e.target.style.background='#fafafe'},onMouseLeave:e=>{if(current!==item.path.replace('#/',''))e.target.style.background='transparent'}},item.label))
  );
}

function Layout({children,current}){
  return React.createElement('div',null,
    React.createElement(Header,null),
    React.createElement('div',{style:{display:'flex'}},
      React.createElement(Sidebar,{current:current}),
      React.createElement('div',{style:{flex:1,padding:24,minHeight:'calc(100vh - 56px)',overflow:'auto'}},children)
    )
  );
}

function useApi(apiFn,depArgs=[]){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const load=useCallback(async()=>{
    setLoading(true);setError(null);
    try{const res=await apiFn();setData(res)}catch(e){setError(e.response?.data?.message||e.message)}
    finally{setLoading(false)}
  },[...depArgs]);
  useEffect(()=>{load()},[load]);
  return {data,loading,error,reload:load};
}

function Pagination({page,totalPages,onChange}){
  if(!totalPages||totalPages<=1)return null;
  const pages=useMemo(()=>{
    const p=[];const start=Math.max(1,page-2);const end=Math.min(totalPages,page+2);
    for(let i=start;i<=end;i++)p.push(i);
    return p;
  },[page,totalPages]);
  return React.createElement('div',{className:'pagination'},
    React.createElement('button',{disabled:page<=1,onClick:()=>onChange(page-1)},'上一页'),
    pages.map(p=>React.createElement('button',{key:p,className:p===page?'active':'',onClick:()=>onChange(p)},p)),
    React.createElement('button',{disabled:page>=totalPages,onClick:()=>onChange(page+1)},'下一页')
  );
}

function BarChart({data,height=120,color='var(--primary)'}){
  if(!data||data.length===0)return React.createElement('div',{style:{color:'var(--text-secondary)',fontSize:13,textAlign:'center',padding:20}},'暂无数据');
  const max=Math.max(...data.map(d=>d.value),1);
  return React.createElement('div',{style:{display:'flex',alignItems:'flex-end',gap:8,height,padding:'0 8px'}},
    data.map((d,i)=>React.createElement('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-end',height:'100%'}},
      React.createElement('div',{style:{width:'100%',height:(d.value/max*100)+'%',background:color,borderRadius:'4px 4px 0 0',minHeight:4,transition:'height 0.3s'}}),
      React.createElement('span',{style:{fontSize:10,marginTop:4,color:'var(--text-secondary)'}},d.label)
    ))
  );
}

function Spinner(){
  return React.createElement('div',{style:{textAlign:'center',padding:40}},React.createElement('div',{className:'spinner'}));
}

function EmptyState({text='暂无数据',action,actionText}){
  return React.createElement('div',{className:'empty'},
    React.createElement('p',null,text),
    action&&React.createElement('button',{className:'btn btn-primary',style:{marginTop:12},onClick:action},actionText||'操作')
  );
}

function ErrorState({text,onRetry}){
  return React.createElement('div',{className:'error'},
    React.createElement('p',null,text||'加载失败'),
    onRetry&&React.createElement('button',{className:'btn btn-outline',style:{marginTop:12},onClick:onRetry},'重试')
  );
}

function ConfirmModal({title,message,onConfirm,onCancel,loading}){
  return React.createElement('div',{className:'modal-overlay',onClick:onCancel},
    React.createElement('div',{className:'modal',onClick:e=>e.stopPropagation(),style:{minWidth:360}},
      React.createElement('h3',null,title||'确认'),
      React.createElement('p',{style:{color:'var(--text-secondary)',marginBottom:16}},message),
      React.createElement('div',{className:'modal-actions'},
        React.createElement('button',{className:'btn btn-outline',onClick:onCancel},'取消'),
        React.createElement('button',{className:'btn btn-danger',onClick:onConfirm,disabled:loading},loading?'处理中...':'确认')
      )
    )
  );
}

// ===================== PAGES =====================

function LoginPage(){
  const {login}=useAuth();
  const [username,setUsername]=useState('');
  const [password,setPassword]=useState('');
  const [error,setError]=useState('');
  const [loading,setLoading]=useState(false);
  const handleSubmit=async(e)=>{
    e.preventDefault();setError('');setLoading(true);
    try{await login(username,password);window.location.hash='#/chat'}
    catch(err){setError(err.response?.data?.message||'登录失败')}
    finally{setLoading(false)}
  };
  return React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'}},
    React.createElement('div',{style:{background:'#fff',borderRadius:16,padding:'40px 36px',width:380,boxShadow:'0 8px 40px rgba(0,0,0,0.2)'}},
      React.createElement('h2',{style:{textAlign:'center',color:'var(--primary)',marginBottom:8,fontSize:24}},'ZUO AI Agent'),
      React.createElement('p',{style:{textAlign:'center',color:'var(--text-secondary)',marginBottom:28,fontSize:13}},'智能对话与知识管理平台'),
      error&&React.createElement('div',{style:{background:'#fde8e8',color:'var(--danger)',padding:'8px 12px',borderRadius:6,marginBottom:12,fontSize:13}},error),
      React.createElement('form',{onSubmit:handleSubmit},
        React.createElement('div',{className:'form-group'},React.createElement('label',null,'用户名'),React.createElement('input',{value:username,onChange:e=>setUsername(e.target.value),placeholder:'请输入用户名',autoFocus:true})),
        React.createElement('div',{className:'form-group'},React.createElement('label',null,'密码'),React.createElement('input',{type:'password',value:password,onChange:e=>setPassword(e.target.value),placeholder:'请输入密码'})),
        React.createElement('button',{type:'submit',className:'btn btn-primary',disabled:loading,style:{width:'100%',justifyContent:'center',padding:'10px 0',marginTop:8,fontSize:15}},loading?'登录中...':'登录')
      )
    )
  );
}

function ChatPage(){
  const [convPage,setConvPage]=useState(1);
  const [convs,setConvs]=useState({content:[],totalPages:0});
  const [selectedConv,setSelectedConv]=useState(null);
  const [messages,setMessages]=useState([]);
  const [msgPage,setMsgPage]=useState(1);
  const [msgTotal,setMsgTotal]=useState(0);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const [convLoading,setConvLoading]=useState(true);
  const [convError,setConvError]=useState(null);
  const [msgLoading,setMsgLoading]=useState(false);
  const [ctxMenu,setCtxMenu]=useState(null);
  const msgEndRef=useRef();
  const eventSourceRef=useRef(null);

  const loadConvs=async()=>{
    setConvLoading(true);setConvError(null);
    try{const d=await apiGet('/api/conversations',{page:convPage,size:20});setConvs(d||{content:[],totalPages:0})}
    catch(e){setConvError(e.response?.data?.message||e.message)}
    finally{setConvLoading(false)}
  };
  useEffect(()=>{loadConvs()},[convPage]);

  const loadMessages=async(convId,page=1)=>{
    setMsgLoading(true);
    try{const d=await apiGet('/api/conversations/'+convId+'/messages',{page,pageSize:20});setMessages(d?.list||[]);setMsgTotal(d?.total||0);setMsgPage(page)}
    catch(e){console.error(e)}
    finally{setMsgLoading(false)}
  };

  const selectConv=conv=>{setSelectedConv(conv);loadMessages(conv.id,1)};
  const createConv=async()=>{
    try{const d=await apiPost('/api/conversations',{title:'新对话'});const newConv={id:d.conversationId||d.conversationId,title:d.title||'新对话',message_count:0,created_at:new Date().toISOString()};setConvs(prev=>({...prev,content:[newConv,...prev.content]}));selectConv(newConv)}
    catch(e){alert('创建失败：'+(e.response?.data?.message||e.message))}
  };
  const sendMsg=async()=>{
    if(!input.trim()||!selectedConv||loading)return;
    const msg=input.trim();setInput('');setLoading(true);
    
    // 1. 发送用户消息到后端
    try{
      await apiPost('/api/conversations/'+selectedConv.id+'/message',{content:msg});
      const userMsgId=Date.now();
      const aiMsgId=Date.now()+1;
      setMessages(prev=>[...prev,{id:userMsgId,content:msg,role:'user',create_time:new Date().toISOString()}]);
      
      // 2. 添加 AI 消息占位符
      setMessages(prev=>[...prev,{id:aiMsgId,content:'',role:'assistant',create_time:new Date().toISOString()}]);
      
      // 3. 使用 EventSource 处理 SSE 流式响应
      const token=localStorage.getItem('token');
      const url='/api/chat/stream/withRag?prompt='+encodeURIComponent(msg)+'&conversationId='+selectedConv.id+'&satoken='+token;
      
      if(eventSourceRef.current){
        eventSourceRef.current.close();
      }
      
      const es=new EventSource(url);
      eventSourceRef.current=es;
      
      es.onmessage=(event)=>{
        const chunk=event.data;
        if(chunk==='[DONE]'){
          es.close();
          eventSourceRef.current=null;
          setLoading(false);
          loadConvs();
          return;
        }
        // 追加文本到 AI 消息
        setMessages(prev=>prev.map(m=>m.id===aiMsgId?{...m,content:m.content+chunk}:m));
      };
      
      es.onerror=(e)=>{
        console.error('SSE error:',e);
        es.close();
        eventSourceRef.current=null;
        setMessages(prev=>prev.map(m=>m.id===aiMsgId?{...m,content:m.content||'抱歉，连接中断'}:m));
        setLoading(false);
      };
      
    }catch(e){
      console.error('发送失败:',e);
      alert('发送失败：'+(e.response?.data?.message||e.message));
      setLoading(false);
    }
  };
  useEffect(()=>{msgEndRef.current?.scrollIntoView({behavior:'smooth'})},[messages]);
  useEffect(()=>{return()=>{if(eventSourceRef.current){eventSourceRef.current.close()}}},[]);

  const handleMsgCtxMenu=(e,msg)=>{
    e.preventDefault();
    setCtxMenu({x:e.clientX,y:e.clientY,msg});
  };
  useEffect(()=>{
    const handler=()=>setCtxMenu(null);
    if(ctxMenu)document.addEventListener('click',handler);
    return ()=>document.removeEventListener('click',handler);
  },[ctxMenu]);
  const deleteMsg=async(msg)=>{
    setCtxMenu(null);
    try{await apiDel('/api/conversations/'+selectedConv.id+'/messages/'+msg.id);setMessages(prev=>prev.filter(m=>m.id!==msg.id));loadConvs()}
    catch(e){alert('删除失败：'+(e.response?.data?.message||e.message))}

  },[]);

  if(loading)return React.createElement('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}},React.createElement(Spinner,null));

  if(!user&&hash!=='/login'){window.location.hash='#/login';return null}
  if(user&&hash==='/login'){window.location.hash='#/chat';return null}
  if(!user)return React.createElement(LoginPage,null);

  const path=hash.startsWith('/')?hash.slice(1):hash;
  const renderPage=()=>{
    if(path==='chat')return React.createElement(ChatPage,null);
    if(path==='chat/knowledge')return React.createElement(KnowledgePage,null);
    if(path.startsWith('chat/knowledge/'))return React.createElement(KnowledgePage,null);
    if(path==='chat/intent')return React.createElement(IntentPage,null);
    if(path==='chat/dashboard')return React.createElement(DashboardPage,null);
    if(path==='monitor/redis')return React.createElement(RedisMonitorPage,null);
    if(path==='monitor/db')return React.createElement(DbMonitorPage,null);
    if(path==='monitor/logs')return React.createElement(LogsPage,null);
    if(path==='approvals')return React.createElement(ApprovalsPage,null);
    if(path==='admin/dashboard')return React.createElement(AdminDashboardPage,null);
    if(path==='admin/tenant')return React.createElement(TenantPage,null);
    if(path==='admin/trace')return React.createElement(RagTraceOverviewPage,null);
    if(path.startsWith('admin/trace/')){const id=path.split('/')[2];return React.createElement(RagTraceDetailPage,{id:id})}
    return React.createElement(ChatPage,null);
  };

  return React.createElement(Layout,{current:path},renderPage());
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(AuthProvider,null,React.createElement(App,null))
);
</script>
</body>
</html>
