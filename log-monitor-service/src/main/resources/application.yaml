server:
  port: 8200
  servlet:
    context-path: /api/log

spring:
  application:
    name: log-monitor-service
  datasource:
    url: jdbc:postgresql://localhost:5432/zuo_ai_agent
    username: jiziyan
    password:
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

log-monitor:
  log-retention-days: 7
  alert:
    dingtalk-webhook: ${DINGTALK_WEBHOOK:}
    error-rate-threshold: 0.1
    avg-duration-threshold-ms: 5000

knife4j:
  enable: true
  setting:
    language: zh_cn