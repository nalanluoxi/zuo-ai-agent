name: Build, Check and Deploy

on:
  push:
    branches: [ master ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests
    
    - name: Verify Ollama configuration
      run: |
        echo "检查 Ollama 配置..."
        
        # 检查 application.yaml 中的 Ollama 配置
        if grep -q "ollama:" src/main/resources/application.yaml; then
          echo "✅ Ollama 配置存在"
        else
          echo "❌ 未找到 Ollama 配置"
          exit 1
        fi
        
        # 提取模型名称
        CHAT_MODEL=$(grep -A 5 "ollama:" src/main/resources/application.yaml | grep "model:" | head -1 | awk '{print $2}')
        EMBEDDING_MODEL=$(grep -A 10 "ollama:" src/main/resources/application.yaml | grep "model:" | tail -1 | awk '{print $2}')
        
        echo "Chat 模型: $CHAT_MODEL"
        echo "Embedding 模型: $EMBEDDING_MODEL"
        
        # 检查生产配置
        if [ -f "src/main/resources/application-prod.yaml" ]; then
          echo "✅ 生产配置文件存在"
          if grep -q "ollama:" src/main/resources/application-prod.yaml; then
            echo "✅ 生产环境 Ollama 配置存在"
          fi
        fi
    
    - name: Start Ollama service
      run: |
        echo "启动 Ollama 服务..."
        
        # 使用 Docker 启动 Ollama
        docker run -d --name ollama -p 11434:11434 ollama/ollama:latest
        
        # 等待 Ollama 启动
        echo "等待 Ollama 服务就绪..."
        for i in {1..30}; do
          if curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; then
            echo "✅ Ollama 服务已就绪"
            break
          fi
          echo "等待中... ($i/30)"
          sleep 2
        done
        
        # 检查是否启动成功
        if ! curl -sf http://localhost:11434/api/tags >/dev/null 2>&1; then
          echo "❌ Ollama 服务启动失败"
          docker logs ollama
          exit 1
        fi
    
    - name: Check and pull Ollama models
      run: |
        echo "检查并拉取 Ollama 模型..."
        
        # 从配置文件提取模型名称
        CHAT_MODEL=$(grep -A 5 "ollama:" src/main/resources/application.yaml | grep "model:" | head -1 | awk '{print $2}')
        EMBEDDING_MODEL=$(grep -A 10 "ollama:" src/main/resources/application.yaml | grep "model:" | tail -1 | awk '{print $2}')
        
        echo "需要检查的模型:"
        echo "  - $CHAT_MODEL"
        echo "  - $EMBEDDING_MODEL"
        
        # 检查模型是否已存在
        MODELS_TO_PULL=()
        
        if docker exec ollama ollama list 2>/dev/null | grep -qF "$CHAT_MODEL"; then
          echo "✅ Chat 模型 $CHAT_MODEL 已存在"
        else
          echo "📦 Chat 模型 $CHAT_MODEL 需要拉取"
          MODELS_TO_PULL+=("$CHAT_MODEL")
        fi
        
        if docker exec ollama ollama list 2>/dev/null | grep -qF "$EMBEDDING_MODEL"; then
          echo "✅ Embedding 模型 $EMBEDDING_MODEL 已存在"
        else
          echo "📦 Embedding 模型 $EMBEDDING_MODEL 需要拉取"
          MODELS_TO_PULL+=("$EMBEDDING_MODEL")
        fi
        
        # 拉取缺失的模型
        if [ ${#MODELS_TO_PULL[@]} -gt 0 ]; then
          echo "开始拉取 ${#MODELS_TO_PULL[@]} 个模型..."
          
          PULL_FAILED=false
          for model in "${MODELS_TO_PULL[@]}"; do
            echo "正在拉取模型: $model"
            if docker exec ollama ollama pull "$model"; then
              echo "✅ 模型 $model 拉取成功"
            else
              echo "⚠️ 模型 $model 拉取失败（CI 资源限制，将在生产环境部署时拉取）"
              PULL_FAILED=true
            fi
          done
          
          if [ "$PULL_FAILED" = true ]; then
            echo "⚠️ 部分模型拉取失败，这不影响构建。生产环境部署时会自动重试。"
          fi
        else
          echo "✅ 所有模型已存在"
        fi
        
        # 显示最终模型列表
        echo ""
        echo "当前 Ollama 模型列表："
        docker exec ollama ollama list || echo "（无法获取模型列表）"
      continue-on-error: true
    
    - name: Build Docker images
      run: |
        echo "构建 Docker 镜像..."
        
        ACR_REGISTRY="crpi-rm9ng8lz6w8psofg.cn-beijing.personal.cr.aliyuncs.com"
        ACR_NAMESPACE="zuo"
        IMAGE_TAG="${GITHUB_SHA::8}"  # 使用 commit hash 前 8 位作为标签
        
        # 构建并标记 zuo-ai-agent 镜像
        echo "构建 zuo-ai-agent 镜像..."
        docker build -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-ai-agent:${IMAGE_TAG} .
        docker tag ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-ai-agent:${IMAGE_TAG} ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-ai-agent:latest
        
        # 构建并标记 auth-service 镜像
        echo "构建 auth-service 镜像..."
        docker build -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-auth-service:${IMAGE_TAG} ./auth-service
        docker tag ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-auth-service:${IMAGE_TAG} ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-auth-service:latest
        
        # 构建并标记 log-monitor-service 镜像
        echo "构建 log-monitor-service 镜像..."
        docker build -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-log-monitor-service:${IMAGE_TAG} ./log-monitor-service
        docker tag ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-log-monitor-service:${IMAGE_TAG} ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-log-monitor-service:latest
        
        # 构建并标记 gateway-service 镜像
        echo "构建 gateway-service 镜像..."
        docker build -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-gateway-service:${IMAGE_TAG} ./gateway-service
        docker tag ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-gateway-service:${IMAGE_TAG} ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-gateway-service:latest
        
        # 构建并标记 web 前端镜像
        echo "构建 web 前端镜像..."
        docker build -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-web:${IMAGE_TAG} ./web
        docker tag ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-web:${IMAGE_TAG} ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-web:latest
        
        # 构建并标记 monitor-web 前端镜像
        echo "构建 monitor-web 前端镜像..."
        docker build -t ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-monitor-web:${IMAGE_TAG} ./monitor-web
        docker tag ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-monitor-web:${IMAGE_TAG} ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-monitor-web:latest
        
        echo "✅ 所有 Docker 镜像构建成功"
        docker images | grep ${ACR_REGISTRY}
    
    - name: Login to Alibaba Cloud ACR
      run: |
        echo "登录阿里云 ACR..."
        echo "${{ secrets.ACR_PASSWORD }}" | docker login --username="${{ secrets.ACR_USERNAME }}" --password-stdin ${{ secrets.ACR_REGISTRY }}
        echo "✅ 登录成功"
    
    - name: Push Docker images to ACR
      run: |
        echo "推送镜像到阿里云 ACR..."
        
        ACR_REGISTRY="crpi-rm9ng8lz6w8psofg.cn-beijing.personal.cr.aliyuncs.com"
        ACR_NAMESPACE="zuo"
        IMAGE_TAG="${GITHUB_SHA::8}"
        
        # 推送 zuo-ai-agent
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-ai-agent:${IMAGE_TAG}
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-ai-agent:latest
        
        # 推送 auth-service
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-auth-service:${IMAGE_TAG}
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-auth-service:latest
        
        # 推送 log-monitor-service
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-log-monitor-service:${IMAGE_TAG}
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-log-monitor-service:latest
        
        # 推送 gateway-service
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-gateway-service:${IMAGE_TAG}
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-gateway-service:latest
        
        # 推送 web 前端
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-web:${IMAGE_TAG}
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-web:latest
        
        # 推送 monitor-web 前端
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-monitor-web:${IMAGE_TAG}
        docker push ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-monitor-web:latest
        
        echo "✅ 所有镜像推送成功"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts
        path: target/*.jar
        retention-days: 7

  deploy:
    needs: build-and-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        command_timeout: 20m
        script: |
          cd /opt/zuo-ai-agent
          git pull || true
          bash scripts/deploy.sh update