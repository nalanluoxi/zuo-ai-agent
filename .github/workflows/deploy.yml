name: Deploy Pipeline

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # 构建 Docker 镜像并推送到 ACR
  # ============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: auth-service
            context: auth-service
            port: 8100
          - name: zuo-ai-agent
            context: .
            port: 8123
          - name: gateway-service
            context: gateway-service
            port: 9000
          - name: log-monitor-service
            context: log-monitor-service
            port: 8200
          - name: web
            context: web
            port: 5173
          - name: monitor-web
            context: monitor-web
            port: 5174
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (多平台支持)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 部署到服务器
  # ============================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose and env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: |
            docker-compose.prod.yml
            .env.example
          target: /opt/zuo-ai-agent/
          overwrite: true
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: ACR_REGISTRY,ACR_NAMESPACE,IMAGE_TAG
          script: |
            cd /opt/zuo-ai-agent

            # 拉取最新镜像
            export ACR_REGISTRY=${{ env.ACR_REGISTRY }}
            export ACR_NAMESPACE=${{ env.ACR_NAMESPACE }}
            export TAG=${{ env.IMAGE_TAG }}

            # 拉取所有镜像
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/auth-service:${IMAGE_TAG}
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/zuo-ai-agent:${IMAGE_TAG}
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/gateway-service:${IMAGE_TAG}
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/log-monitor-service:${IMAGE_TAG}
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/web:${IMAGE_TAG}
            docker pull ${ACR_REGISTRY}/${ACR_NAMESPACE}/monitor-web:${IMAGE_TAG}

            # 重新创建容器（零停机）
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # 清理旧镜像（保留最新 + 2个历史版本）
            docker image prune -f --filter "label=maintainer=zuo-ai-agent"

            # 显示状态
            echo "=== 部署完成 ==="
            docker-compose -f docker-compose.prod.yml ps
