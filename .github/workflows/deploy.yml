# ============================================
#  CI/CD: 构建 → 推送 ACR → SSH 部署到服务器
#  触发: push 到 main 分支
# ============================================

name: Build & Deploy

on:
  push:
    branches: [ master ]

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  APP_PREFIX: zuo
  TAG: latest

jobs:
  # ============================================
  #  Stage 1: 构建并推送所有镜像到 ACR
  # ============================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: zuo-ai-agent
            context: .
            dockerfile: Dockerfile
          - name: auth-service
            context: ./auth-service
            dockerfile: ./auth-service/Dockerfile
          - name: gateway-service
            context: ./gateway-service
            dockerfile: ./gateway-service/Dockerfile
          - name: log-monitor-service
            context: ./log-monitor-service
            dockerfile: ./log-monitor-service/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: monitor-web
            context: ./monitor-web
            dockerfile: ./monitor-web/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.APP_PREFIX }}-${{ matrix.service.name }}:${{ env.TAG }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.APP_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}

  # ============================================
  #  Stage 2: SSH 登录服务器，拉取新镜像并部署
  # ============================================
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP_HOME="/opt/zuo-ai-agent"
            COMPOSE_FILE="$APP_HOME/docker-compose.prod.yml"
            ENV_FILE="$APP_HOME/.env"

            echo "=== 1. 登录 ACR ==="
            docker login ${{ secrets.ACR_REGISTRY }} \
              -u ${{ secrets.ACR_USERNAME }} \
              -p ${{ secrets.ACR_PASSWORD }}

            echo "=== 2. 拉取最新镜像 ==="
            cd $APP_HOME
            docker compose -f $COMPOSE_FILE --env-file $ENV_FILE pull

            echo "=== 3. 重新部署 ==="
            docker compose -f $COMPOSE_FILE --env-file $ENV_FILE up -d --remove-orphans

            echo "=== 4. 清理旧镜像 ==="
            docker image prune -f

            echo "=== 5. 服务状态 ==="
            docker compose -f $COMPOSE_FILE --env-file $ENV_FILE ps

            echo "=== 部署完成 ==="
