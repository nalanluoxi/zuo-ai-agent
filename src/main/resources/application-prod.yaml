# 生产环境配置
# 所有敏感信息通过环境变量注入，禁止硬编码

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zuo_ai_agent}
    username: ${DB_USERNAME:zuo_ai}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:placeholder}
      chat:
        options:
          model: qwen-plus
    openai:
      api-key: ${SILICONFLOW_API_KEY:placeholder}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
      embedding:
        options:
          model: netease-youdao/bce-embedding-base_v1
    ollama:
      base-url: ${OLLAMA_HOST:http://localhost:11434}
      chat:
        enabled: true
        options:
          model: qwen2.5:7b
      embedding:
        enabled: true
        options:
          model: dengcao/Qwen3-Embedding-8B:F16
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 生产环境不用 stdout

logging:
  level:
    root: WARN
    com.example.zuoaiagent: INFO
    org.springframework.web: WARN

# 认证服务地址（Docker 容器内使用服务名，本地开发覆盖为 localhost）
auth:
  service:
    url: http://auth-service:8100/api/auth

# 日志监控服务地址（Docker 容器内使用服务名）
log:
  monitor:
    url: http://log-monitor-service:8200/api/log/collect

# Tesseract OCR（生产环境路径）
ocr:
  tesseract:
    data-path: /usr/share/tessdata

# 生产环境禁用 Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
