spring:
  application:
    name: zuo-ai-agent
  profiles:
    active: local
  autoconfigure:
    # 纯 Java 项目，排除 springdoc Kotlin 自动配置，避免 ClassNotFoundException: kotlin.reflect.full.KClasses
    exclude: org.springdoc.core.configuration.SpringDocKotlinConfiguration
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
    openai:
      api-key: ${SILICONFLOW_API_KEY}
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
      embedding:
        options:
          model: bce-embedding-base_v1   # 或 Qwen/Qwen3-Embedding-8B
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: true
        options:
          model: qwen2.5:0.5b
      embedding:
        enabled: true
        options:
          model: dengcao/Qwen3-Embedding-8B:F16  # 必须与 ollama list 中的名字完全一致，运行前执行：ollama pull dengcao/Qwen3-Embedding-8B:F16
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  datasource:
    url: ${DB_URL}
    #username: ${DB_USERNAME}
    username: postgres.aaqhwitflxtjnsgyrsin
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
      timeout: 3000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.example.zuoaiagent: INFO

server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.example.zuoaiagent

# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn

# 文档入库流水线配置
ingestion:
  chunking:
    # 默认分块大小（字符数）。中文约 1.5~2 token/字，300 字符 ≈ 450~600 token，
    # 适配 bce-embedding(512 token 上限) 的兜底候选；Qwen3-Embedding 无此限制
    chunk-size: 300
    # 默认相邻块重叠大小（字符数）
    overlap-size: 50
  enrichment:
    # 是否开启摘要元数据增强（为每个 chunk 生成 CURRENT/PREVIOUS/NEXT 三种摘要写入 metadata）
    # 注意：会调用 LLM，入库时间会增加，建议在非高频入库场景开启
    enable-summary: false
    # 是否开启关键词元数据增强（从每个 chunk 提取 N 个关键词写入 metadata）
    enable-keyword: true
    # 提取关键词数量
    keyword-count: 5

# Tesseract OCR 配置（图片型 PDF 兜底识别）
ocr:
  tesseract:
    data-path: /opt/homebrew/share/tessdata   # Apple Silicon Homebrew 路径

# Embedding 多候选模型路由与熔断配置
embedding:
  selection:
    # 连续失败多少次后触发熔断（进入 OPEN 状态）
    failure-threshold: 2
    # 熔断持续时间（毫秒），超过后转为 HALF_OPEN 进行探测
    open-duration-ms: 30000
  candidates:
    # 主候选：本地 Ollama dengcao/Qwen3-Embedding-8B（需提前 ollama pull）
    - id: ollama-qwen3
      provider: ollama
      model: dengcao/Qwen3-Embedding-8B:F16
      priority: 1
      enabled: true
    # 备用候选 1：SiliconFlow Qwen3-Embedding-8B，维度 4096，无 512 token 限制
    - id: siliconflow-qwen3
      provider: openai
      model: Qwen/Qwen3-Embedding-8B
      priority: 2
      enabled: true
    # 备用候选 2：SiliconFlow netease-youdao/bce-embedding-base_v1，维度 768，注意 512 token 上限
    - id: siliconflow-bce
      provider: openai
      model: netease-youdao/bce-embedding-base_v1
      priority: 3
      enabled: false

# 意图树缓存刷新配置
intent:
  cache:
    # 意图树缓存刷新间隔（毫秒），默认 5 分钟
    refresh-interval-ms: 300000

# Chat 多候选模型路由与熔断配置 + 对话记忆配置
chat:
  # 对话记忆参数（DbBasedChatMemory）
  memory:
    # 消息轮数超过此阈值时触发摘要压缩（每轮 = 1 user + 1 assistant = 2 条消息）
    summary-start-turns: 10
    # 历史记忆保留的最近消息条数（供 MessageChatMemoryAdvisor 使用）
    history-keep: 20
  selection:
    failure-threshold: 2
    open-duration-ms: 30000
  candidates:
    # 本地候选：Ollama qwen2.5:0.5b（离线可用，无需 API Key）
    - id: ollama-qwen
      provider: ollama
      model: qwen2.5:0.5b
      priority: 1
      enabled: true
    # 主候选：DashScope qwen-plus
    - id: dashscope-qwen
      provider: dashscope
      model: qwen-plus
      priority: 2
      enabled: false
    # 备用候选：SiliconFlow DeepSeek-V3（OpenAI 兼容接口）
    - id: siliconflow-deepseek
      provider: openai
      model: deepseek-ai/DeepSeek-V3
      priority: 3
      enabled: false

# RabbitMQ 队列声明
zuo:
  rabbitmq:
    exchange: zuo.ai.agent
    queues:
      ingestion: ingestion.queue
      chat-memory-persistence: chat.memory.persistence.queue
      chat-memory-compression: chat.memory.compression.queue